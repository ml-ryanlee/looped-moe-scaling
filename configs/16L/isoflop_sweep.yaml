# 16-layer isoFLOP study (Figures 1, 3, 9, 10). Widths per compute budget as run.
# python scripts/sweep.py configs/16L/isoflop_sweep.yaml [--only base] [--run]
groups:
  base:
    config: configs/16L/base.yaml
    budgets: ["5e16", "2e17", "5e17", "1e18"]
    widths:
      "5e16": [128, 192, 256, 320, 384]
      "2e17": [192, 256, 320, 384, 448, 512, 704]
      "5e17": [320, 384, 448, 512, 576, 640, 704, 768, 832]
      "1e18": [640, 704, 768, 832, 896, 960, 1024]
  looped:
    config: configs/16L/looped.yaml
    budgets: ["5e16", "2e17", "5e17", "1e18"]
    widths:
      "5e16": [128, 192, 256, 320, 384]
      "2e17": [320, 384, 512, 640, 704]
      "5e17": [448, 512, 576, 640, 704]
      "1e18": [640, 704, 768, 832, 896, 960, 1024]
  moe:
    config: configs/16L/moe.yaml
    budgets: ["5e16", "2e17", "5e17", "1e18"]
    widths:
      "5e16": [128, 192, 256, 320, 384]
      "2e17": [192, 256, 320, 384, 448]
      "5e17": [320, 384, 448, 512, 576]
      "1e18": [640, 704, 768, 832, 896, 960, 1024]
  looped_moe:
    config: configs/16L/looped_moe.yaml
    budgets: ["5e16", "2e17", "5e17", "1e18"]
    widths:
      "5e16": [128, 192, 256, 320, 384]
      "2e17": [192, 256, 320, 384, 448]
      "5e17": [320, 384, 448, 512, 576, 704]
      "1e18": [640, 704, 768, 832, 896, 960, 1024]
