[project]
name = "loop-moe-scaling"
version = "1.0.0"
description = "Code for 'Sparse Layers are Critical to Scaling Looped Language Models'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.10.0",
    "einops>=0.8.1",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
data = ["datasets>=4.0", "tokenizers>=0.22", "tqdm>=4.66"]
hf = ["transformers>=5.3.0", "huggingface-hub>=1.5.0", "safetensors>=0.7.0"]
wandb = ["wandb>=0.24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["looped_scaling"]
